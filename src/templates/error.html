{% extends "base.html" %}
{% from "icons.html" import icon %}
{% block content %}
  <div class="panel error-page">
    <div class="error-icon">{{ icon(icon_name) }}</div>
    <p class="error-code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn" href="{{ url_for('home') }}">{{ icon('home') }}Back to home</a>
  </div>
{% endblock %}
