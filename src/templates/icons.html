{% macro icon(name, extra='') -%}
<svg class="icon {{ extra }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'ticket' %}<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 6v12" stroke-dasharray="2 2"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'check' %}<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>
{% elif name == 'list' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.7 0 4.5 1.8 4.5 4.5"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'edit' %}<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>
{% elif name == 'trash' %}<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>
{% elif name == 'shield' %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{% elif name == 'back' %}<path d="M19 12H5M11 6l-6 6 6 6"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{% elif name == 'inbox' %}<path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/>
{% elif name == 'logout' %}<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M11 12h9M16 8l4 4-4 4"/>
{% endif %}
</svg>
{%- endmacro %}
