{% extends "base.html" %}
{% block content %}
  <h1>Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label>Username <input name="username" maxlength="50" required></label></p>
    <p><label>Email <input name="email" type="email" maxlength="120" required></label></p>
    <p><label>Password <input name="password" type="password" minlength="8" required></label></p>
    <button type="submit">Register</button>
  </form>
{% endblock %}
