{% extends "base.html" %}
{% block content %}
  <h1>All tickets</h1>
  <table border="1" cellpadding="6">
    <tr><th>ID</th><th>Title</th><th>Owner</th><th>Priority</th><th>Status</th><th>Created</th></tr>
    {% for t, u in rows %}
    <tr>
      <td>{{ t.id }}</td>
      <td>{{ t.title }}</td>
      <td>{{ u.username }}</td>
      <td>{{ t.priority }}</td>
      <td>{{ t.status }}</td>
      <td>{{ t.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
    </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('admin_dashboard') }}">Back to admin dashboard</a></p>
{% endblock %}
