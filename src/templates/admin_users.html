{% extends "base.html" %}
{% block content %}
  <h1>Users</h1>
  <table border="1" cellpadding="6">
    <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Registered</th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.email }}</td>
      <td>{{ u.role }}</td>
      <td>{{ u.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
    </tr>
    {% endfor %}
  </table>
  <p><a href="{{ url_for('admin_dashboard') }}">Back to admin dashboard</a></p>
{% endblock %}
