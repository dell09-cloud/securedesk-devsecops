{% extends "base.html" %}
{% block content %}
  <h1>Ticket #{{ ticket.id }}: {{ ticket.title }}</h1>
  <p>Priority: {{ ticket.priority }} | Status: {{ ticket.status }}</p>
  <p style="white-space: pre-wrap">{{ ticket.description }}</p>
  <p><a href="{{ url_for('tickets') }}">Back to my tickets</a></p>
{% endblock %}
