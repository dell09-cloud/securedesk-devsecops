{% extends "base.html" %}
{% block content %}
  <h1>Ticket #{{ ticket.id }}: {{ ticket.title }}</h1>
  <p>Priority: {{ ticket.priority }} | Status: {{ ticket.status }}</p>
  <p style="white-space: pre-wrap">{{ ticket.description }}</p>

  <div>
    <a href="{{ url_for('ticket_edit', ticket_id=ticket.id) }}">Edit</a>

    {% if ticket.status == 'open' %}
    <form method="post" action="{{ url_for('ticket_close', ticket_id=ticket.id) }}" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Close ticket</button>
    </form>
    {% endif %}

    <form method="post" action="{{ url_for('ticket_delete', ticket_id=ticket.id) }}" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">Delete ticket</button>
    </form>
  </div>

  <p><a href="{{ url_for('tickets') }}">Back to my tickets</a></p>
{% endblock %}
